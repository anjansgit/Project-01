<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn about this little corner of the web." />
    <title>About · Hello</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; color: #f8fafc; background: radial-gradient(circle at 12% 18%, #7c3aed 0, transparent 30rem), radial-gradient(circle at 86% 76%, #06b6d4 0, transparent 28rem), #07111f; }
      nav { display: flex; justify-content: space-between; align-items: center; width: min(90%, 70rem); margin: 1.5rem auto; }
      .brand { color: #fff; font-weight: 800; letter-spacing: -0.04em; text-decoration: none; }
      nav ul { display: flex; gap: .45rem; margin: 0; padding: 0; list-style: none; }
      nav a:not(.brand) { padding: .55rem .85rem; border-radius: 999px; color: #cbd5e1; text-decoration: none; }
      nav a:not(.brand):hover, nav a[aria-current="page"] { color: #fff; background: rgb(255 255 255 / .12); }
      main { width: min(90%, 50rem); margin: clamp(3rem, 11vh, 8rem) auto; padding: clamp(2rem, 7vw, 5rem); border: 1px solid rgb(255 255 255 / .2); border-radius: 2rem; background: rgb(15 23 42 / .6); box-shadow: 0 2rem 5rem rgb(0 0 0 / .38); backdrop-filter: blur(18px); animation: appear .7s both; }
      .eyebrow { margin: 0 0 1rem; color: #a5f3fc; font-size: .78rem; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3rem, 9vw, 5.5rem); line-height: .95; letter-spacing: -.07em; background: linear-gradient(115deg, #fff 22%, #c4b5fd 52%, #67e8f9 82%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p:not(.eyebrow) { color: #cbd5e1; font-size: 1.1rem; line-height: 1.75; }
      .values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 2rem; }
      .value { padding: 1rem; border: 1px solid rgb(255 255 255 / .12); border-radius: 1rem; background: rgb(255 255 255 / .05); color: #e2e8f0; font-weight: 650; }
      @keyframes appear { from { opacity: 0; transform: translateY(1.5rem); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 34rem) { .values { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <nav aria-label="Main navigation"><a class="brand" href="index.html">hello.</a><ul><li><a href="index.html">Home</a></li><li><a href="about.html" aria-current="page">About</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
    <main>
      <p class="eyebrow">About this space</p>
      <h1>Small start.<br />Big ideas.</h1>
      <p>This is a friendly place to experiment, learn, and turn the next spark of an idea into something real.</p>
      <div class="values"><div class="value">Stay curious</div><div class="value">Make it simple</div><div class="value">Keep moving</div></div>
    </main>
  </body>
</html>
