<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A stylish Hello World landing page." />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f8fafc;
        background:
          radial-gradient(circle at 12% 18%, #7c3aed 0, transparent 30rem),
          radial-gradient(circle at 86% 76%, #06b6d4 0, transparent 28rem),
          #07111f;
      }

      .orb {
        position: fixed;
        width: 18rem;
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0.45;
        filter: blur(2px);
        animation: drift 12s ease-in-out infinite alternate;
      }

      .orb--one { top: -6rem; right: 10%; background: #ec4899; }
      .orb--two { bottom: -8rem; left: 8%; background: #4f46e5; animation-delay: -5s; }

      main {
        width: min(90%, 46rem);
        padding: clamp(2rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgb(255 255 255 / 0.2);
        border-radius: 2rem;
        background: rgb(15 23 42 / 0.6);
        box-shadow: 0 2rem 5rem rgb(0 0 0 / 0.38);
        backdrop-filter: blur(18px);
        animation: appear 700ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #a5f3fc;
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.25rem, 12vw, 7rem);
        line-height: 0.95;
        letter-spacing: -0.075em;
        background: linear-gradient(115deg, #fff 22%, #c4b5fd 52%, #67e8f9 82%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p:not(.eyebrow) {
        max-width: 34rem;
        margin: 1.75rem auto 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 2rem;
        padding: 0.65rem 0.95rem;
        border: 1px solid rgb(255 255 255 / 0.15);
        border-radius: 999px;
        color: #e2e8f0;
        background: rgb(255 255 255 / 0.06);
        font-size: 0.9rem;
      }

      .dot {
        width: 0.55rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 1rem #34d399;
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(1.5rem) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes drift {
        to { transform: translate(2.5rem, 2rem) scale(1.12); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb--one" aria-hidden="true"></div>
    <div class="orb orb--two" aria-hidden="true"></div>
    <main>
      <p class="eyebrow">A fresh beginning</p>
      <h1>Hello, World!</h1>
      <p>Your first page is live—made with curiosity, a little code, and a dash of color.</p>
      <div class="status"><span class="dot"></span> Ready to build something great</div>
    </main>
  </body>
</html>
