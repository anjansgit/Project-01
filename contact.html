<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch." />
    <title>Contact · Hello</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; color: #f8fafc; background: radial-gradient(circle at 12% 18%, #7c3aed 0, transparent 30rem), radial-gradient(circle at 86% 76%, #06b6d4 0, transparent 28rem), #07111f; }
      nav { display: flex; justify-content: space-between; align-items: center; width: min(90%, 70rem); margin: 1.5rem auto; }
      .brand { color: #fff; font-weight: 800; letter-spacing: -.04em; text-decoration: none; }
      nav ul { display: flex; gap: .45rem; margin: 0; padding: 0; list-style: none; }
      nav a:not(.brand) { padding: .55rem .85rem; border-radius: 999px; color: #cbd5e1; text-decoration: none; }
      nav a:not(.brand):hover, nav a[aria-current="page"] { color: #fff; background: rgb(255 255 255 / .12); }
      main { width: min(90%, 44rem); margin: clamp(3rem, 8vh, 6rem) auto; padding: clamp(2rem, 6vw, 4rem); border: 1px solid rgb(255 255 255 / .2); border-radius: 2rem; background: rgb(15 23 42 / .6); box-shadow: 0 2rem 5rem rgb(0 0 0 / .38); backdrop-filter: blur(18px); animation: appear .7s both; }
      .eyebrow { margin: 0 0 1rem; color: #a5f3fc; font-size: .78rem; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3rem, 9vw, 5.5rem); line-height: .95; letter-spacing: -.07em; background: linear-gradient(115deg, #fff 22%, #c4b5fd 52%, #67e8f9 82%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { color: #cbd5e1; line-height: 1.7; }
      form { display: grid; gap: 1rem; margin-top: 2rem; }
      label { display: grid; gap: .45rem; color: #e2e8f0; font-size: .9rem; font-weight: 650; }
      input, textarea { width: 100%; padding: .85rem 1rem; border: 1px solid rgb(255 255 255 / .16); border-radius: .8rem; outline: none; color: #f8fafc; background: rgb(255 255 255 / .07); font: inherit; }
      input:focus, textarea:focus { border-color: #67e8f9; box-shadow: 0 0 0 .2rem rgb(103 232 249 / .15); }
      textarea { min-height: 8rem; resize: vertical; }
      button { justify-self: start; padding: .8rem 1.2rem; border: 0; border-radius: 999px; cursor: pointer; color: #07111f; background: linear-gradient(115deg, #a5f3fc, #c4b5fd); font: inherit; font-weight: 800; }
      button:hover { filter: brightness(1.1); transform: translateY(-1px); }
      @keyframes appear { from { opacity: 0; transform: translateY(1.5rem); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <nav aria-label="Main navigation"><a class="brand" href="index.html">hello.</a><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>
    <main>
      <p class="eyebrow">Say hello</p>
      <h1>Let's talk.</h1>
      <p>Have an idea, a question, or just want to say hi? Leave a note below.</p>
      <form action="#" method="post">
        <label>Name<input type="text" name="name" autocomplete="name" placeholder="Your name" required /></label>
        <label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required /></label>
        <label>Message<textarea name="message" placeholder="What's on your mind?" required></textarea></label>
        <button type="submit">Send message</button>
      </form>
    </main>
  </body>
</html>
